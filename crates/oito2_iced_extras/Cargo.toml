[package]
name = "oito2_iced_extras"
description = "Extra widgets for the OITO2 Iced design system: QR code, signature pad, image cropper and navigation menu."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
iced = { workspace = true, features = ["advanced", "canvas", "image", "qr_code", "x11", "wayland", "thread-pool"] }
image.workspace = true
oito2_iced = { workspace = true, features = ["image", "qr_code"] }
qrcode.workspace = true

[dev-dependencies]
iced = { workspace = true, features = ["advanced", "x11", "wayland", "tiny-skia"] }
iced_test.workspace = true
oito2_iced_test_utils.workspace = true
serde_json.workspace = true

[lints]
workspace = true
