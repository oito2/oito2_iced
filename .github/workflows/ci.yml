name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Runs of different events don't cancel each other, and only pull request
# runs give way to a newer push to the same branch.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Format, lint, docs and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install windowing and GLib development files
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libglib2.0-dev
      # rustup installs the toolchain pinned in rust-toolchain.toml on first use.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Windows and macOS are best effort: their results are reported but
    # don't fail the workflow.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      # Every platform reports its result, even when another one fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # The simulator tests and the goldens use the software renderer.
      ICED_TEST_BACKEND: tiny-skia
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install windowing and GLib development files
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libglib2.0-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --all-features --locked
      # A failing golden writes `<name>.actual.png` next to it.
      - name: Upload failing snapshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshots-${{ matrix.os }}
          path: crates/*/tests/goldens/*.actual.png
          if-no-files-found: ignore

  msrv:
    name: Rust MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Every rustup proxy, the cache action's probe included, uses the MSRV of
    # Cargo.toml instead of the toolchain pinned in rust-toolchain.toml.
    env:
      RUSTUP_TOOLCHAIN: '1.97'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install windowing and GLib development files
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libglib2.0-dev
      - run: rustup toolchain install 1.97 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv
      - run: cargo +1.97 check --workspace --all-features --locked
